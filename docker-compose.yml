# Deepfreeze server — Docker Compose deployment.
#
#   1. Copy packages/deepfreeze-cli/config.yml.example to ./config.yml and edit
#      it (Elasticsearch connection, auth tokens, scheduled jobs).
#      NOTE: elasticsearch.hosts must be reachable FROM INSIDE the container.
#      If ES runs on the Docker host, use http://host.docker.internal:9200
#      (add the extra_hosts entry below on Linux) rather than localhost.
#   2. docker compose up -d --build
#   3. Browse to http://localhost:8000
#
# See packages/deepfreeze-server/README.md ("Docker") for details.

services:
  deepfreeze-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Cloud extras baked into the image. Default covers all backends.
        # Override to slim down, e.g. "[azure]", "[gcp]", or "" for aws-only.
        CORE_EXTRAS: "[azure,gcp]"
    image: deepfreeze-server:latest
    container_name: deepfreeze-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Your deepfreeze config (read-only). Required.
      - ./config.yml:/etc/deepfreeze/config.yml:ro
      # Optional: mount cloud credentials for self-managed (ambient) auth.
      # - ${HOME}/.aws:/home/deepfreeze/.aws:ro
      # - ./gcp-sa.json:/home/deepfreeze/.gcp/creds.json:ro
      # Optional: TLS material if config.server.tls is set.
      # - ./tls:/etc/deepfreeze/tls:ro
    # Storage credentials may be supplied via env instead of mounted files.
    # Uncomment and fill what you use (bare names pass through from your shell):
    #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION
    #   AZURE_STORAGE_CONNECTION_STRING
    #   GOOGLE_APPLICATION_CREDENTIALS=/home/deepfreeze/.gcp/creds.json
    # Override the bind port if needed (default 8000): DEEPFREEZE_PORT
    environment: []
    # On Linux, lets the container reach an Elasticsearch running on the host
    # via http://host.docker.internal:9200 (built in on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
